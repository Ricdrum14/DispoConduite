services:
  postgres:
    image: postgres:16-alpine
    container_name: dispoconduite_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dispouser
      POSTGRES_PASSWORD: dispopass
      POSTGRES_DB: dispoconduite
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - '8081:8080'

volumes:
  pgdata:
